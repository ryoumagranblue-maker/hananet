<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商品管理ダッシュボード - 花ネット</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { background: #fbf7f2; padding: 20px; font-family: "Noto Sans JP", sans-serif; }
  .admin-wrapper { max-width: 1000px; margin: 0 auto; background: #fff; border: 1px solid #eadbd7; border-radius: 8px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
  .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #5b793f; padding-bottom: 15px; margin-bottom: 25px; }
  .admin-header h1 { font-size: 20px; color: #5b793f; margin: 0; }
  .back-link { color: #b65b78; text-decoration: none; font-size: 12px; font-weight: bold; }
  .back-link:hover { text-decoration: underline; }
  
  /* ログイン画面 */
  .login-box { max-width: 400px; margin: 50px auto; padding: 30px; border: 1px solid #eadbd7; border-radius: 8px; background: #fffaf8; text-align: center; }
  .field { margin-bottom: 15px; text-align: left; }
  .field label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #4b433e; }
  .field input, .field textarea, .field select { width: 100%; padding: 8px; border: 1px solid #e0d4cd; border-radius: 4px; box-sizing: border-box; }
  .btn-main { background: #789c55; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
  .btn-main:hover { background: #4d7435; }
  .error-msg { color: #b04e5b; font-size: 12px; margin-top: 10px; }

  /* 管理画面本体 */
  .product-admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 12px; }
  .product-admin-table th, .product-admin-table td { border: 1px solid #e3e8d9; padding: 8px 10px; text-align: left; vertical-align: middle; }
  .product-admin-table th { background: #f3f7eb; color: #4d7435; font-weight: bold; }
  .product-admin-table td img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; vertical-align: middle; margin-right: 8px; background: #f8f3ee; }
  
  .btn-sm { padding: 4px 10px; font-size: 11px; border: 1px solid #d96b91; background: #fff0f4; color: #b84c73; border-radius: 3px; cursor: pointer; margin-right: 4px; }
  .btn-sm:hover { background: #d96b91; color: white; }
  .btn-del { border-color: #ccc; background: #f5f5f5; color: #666; }
  .btn-del:hover { background: #d9534f; color: white; border-color: #d9534f; }
  
  .top-action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .btn-add { background: #d96b91; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; }
  .btn-add:hover { background: #b84c73; }

  /* モーダルフォーム */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal-content { background: white; width: min(600px, 100%); max-height: 90vh; overflow-y: auto; padding: 25px; border-radius: 8px; box-shadow: 0 5px 25px rgba(0,0,0,0.2); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
</style>
</head>
<body>

<div id="app">
  <!-- ログイン画面 -->
  <div id="login-view" class="login-box">
    <h2>管理者ログイン</h2>
    <p style="font-size: 12px; color: #877a72; margin-bottom: 20px;">花ネットの商品データを管理するにはログインしてください。</p>
    <div class="field">
      <label>管理者ID</label>
      <input type="text" id="login-id" value="admin">
    </div>
    <div class="field">
      <label>パスワード</label>
      <input type="password" id="login-pass" placeholder="パスワードを入力">
    </div>
    <button class="btn-main" onclick="handleLogin()">ログイン</button>
    <div id="login-error" class="error-msg"></div>
    <div style="margin-top: 20px;">
      <a href="index.html" class="back-link">← サイトトップへ戻る</a>
    </div>
  </div>

  <!-- 管理ダッシュボード画面 -->
  <div id="admin-view" class="admin-wrapper" style="display: none;">
    <div class="admin-header">
      <h1>花ネット — 商品管理ダッシュボード</h1>
      <div>
        <a href="index.html" class="back-link" style="margin-right: 15px;">🌐 サイトを確認</a>
        <a href="#" class="back-link" onclick="handleLogout()">ログアウト</a>
      </div>
    </div>

    <div class="top-action-bar">
      <span>登録されている商品の一覧・編集・削除が行えます。</span>
      <button class="btn-add" onclick="openProductModal()">＋ 新規商品を追加</button>
    </div>

    <table class="product-admin-table">
      <thead>
        <tr>
          <th>商品画像 / 名称</th>
          <th>カテゴリ</th>
          <th>価格（税抜）</th>
          <th>在庫</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="admin-product-list">
        <!-- JavaScriptで動的生成 -->
      </tbody>
    </table>
  </div>
</div>

<!-- 編集・追加用モーダル -->
<div id="product-modal" class="modal-overlay">
  <div class="modal-content">
    <h3 id="modal-title" style="margin-top:0; color:#5b793f;">商品編集</h3>
    <input type="hidden" id="edit-id">
    <div class="field">
      <label>商品名</label>
      <input type="text" id="p-name">
    </div>
    <div class="row">
      <div class="field">
        <label>価格（税抜・円）</label>
        <input type="number" id="p-price">
      </div>
      <div class="field">
        <label>カテゴリコード (cut, pot, seedling, green, rose 等)</label>
        <input type="text" id="p-category">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>在庫数</label>
        <input type="number" id="p-stock" value="20">
      </div>
      <div class="field">
        <label>色・カラー</label>
        <input type="text" id="p-color" value="おまかせ">
      </div>
    </div>
    <div class="field">
      <label>商品画像URL</label>
      <input type="url" id="p-image" placeholder="https://...">
    </div>
    <div class="field">
      <label>商品説明</label>
      <textarea id="p-desc" rows="3"></textarea>
    </div>
    <div class="field">
      <label>配送温度帯</label>
      <select id="p-shipping">
        <option value="常温">常温</option>
        <option value="クール">クール</option>
      </select>
    </div>

    <div style="display: flex; gap: 10px; margin-top: 20px;">
      <button class="btn-main" onclick="saveProductData()">保存する</button>
      <button class="btn-main btn-del" onclick="closeProductModal()" style="background:#ddd; color:#333;">キャンセル</button>
    </div>
  </div>
</div>

<script>
// 花ネットの全初期商品データ（再現デモの全件）
const defaultProducts = [
  {id:1, name:"奉仕品ピンポン菊 1ロット10本 白", price:1600, category:"cut", desc:"奉仕価格での販売は1回の発送につき1ロットまで。70cm程度。", stock:20, color:"白", shipping:"常温", image:"https://web.archive.org/web/20230930002033im_/http://hananet.jp/image/index/left_ber02.gif"},
  {id:2, name:"奉仕品ピンポン菊 1ロット10本 黄色", price:1600, category:"cut", desc:"奉仕価格での販売は1回の発送につき1ロットまで。70cm程度。", stock:20, color:"黄色", shipping:"常温", image:"https://web.archive.org/web/20230930002033im_/http://hananet.jp/image/index/left_ber02.gif"},
  {id:3, name:"特価品ガーベラ 1ロット20本 色おまかせ", price:2000, category:"cut", desc:"色おまかせ。1ロット20本。", stock:15, color:"おまかせ", shipping:"常温", image:"https://web.archive.org/web/20230930002033im_/http://hananet.jp/image/index/left_ber02.gif"},
  {id:4, name:"特価品ガーベラ 1ロット10本", price:1000, category:"cut", desc:"色を選ぶ切り花特価品。1ロット10本。", stock:30, color:"白・黄・ピンク・オレンジ・赤", shipping:"常温", image:"https://web.archive.org/web/20230930002033im_/http://hananet.jp/image/index/left_ber02.gif"},
  {id:5, name:"スプレーカーネーション 1ロット25本", price:5000, category:"cut", desc:"長さ50cm程度。色・希望日はお問い合わせください。", stock:12, color:"赤・ピンク・黄・オレンジ・赤", shipping:"常温", image:"https://web.archive.org/web/20230930002033im_/http://hananet.jp/image/index/left_ber02.gif"},
  {id:6, name:"カーネーション 1ロット50本 色おまかせMix", price:9,500, category:"cut", desc:"切り花まとめ買い向け商品。", stock:10, color:"色おまかせMix", shipping:"常温", image:"https://web.archive.org/web/20230930002033im_/http://hananet.jp/image/index/left_ber02.gif"},
  {id:7, name:"カーネーション 1ロット25本", price:5000, category:"cut", desc:"色を選べる切り花。", stock:15, color:"ピンク・黄色・赤", shipping:"常温", image:"https://web.archive.org/web/20230930002033im_/http://hananet.jp/image/index/left_ber02.gif"},
  {id:8, name:"バラ 1ロット20本", price:3,900, category:"rose", desc:"複数色から選べるバラ。", stock:15, color:"ピンク・黄色・オレンジ・赤", shipping:"常温", image:"https://web.archive.org/web/20230930002033im_/http://hananet.jp/image/index/left_ber02.gif"},
  {id:9, name:"アンスリューム", price:3500, category:"pot", desc:"2023年9月29日新春の導入詳細に基づく。", stock:8, color:"赤・色各色", shipping:"常温", image:"https://web.archive.org/web/20230930002033im_/http://hananet.jp/image/index/left_ber02.gif"},
  {id:10, name:"胡蝶蘭", price:8,800, category:"orchid", desc:"HANTENサイトの商品カテゴリを参考にしたデモ商品。価格は仮設定。", stock:5, color:"白など", shipping:"常温", image:"https://web.archive.org/web/20230930002033im_/http://hananet.jp/image/index/left_ber02.gif"},
  {id:11, name:"観葉植物", price:2,800, category:"green", desc:"HANTENサイトの商品カテゴリを参考にしたデモ商品。価格は仮設定。", stock:6, color:"商品による", shipping:"常温", image:"https://web.archive.org/web/20230930002033im_/http://hananet.jp/image/index/left_ber02.gif"},
  {id:12, name:"お供え・弔事アレンジ", price:3,500, category:"condolence", desc:"HANTENサイトの商品カテゴリを参考にしたデモ商品。価格は仮設定。", stock:8, color:"白・淡色系", shipping:"常温", image:"https://web.archive.org/web/20230930002033im_/http://hananet.jp/image/index/left_ber02.gif"}
];
let products = JSON.parse(localStorage.getItem('hananet_products') || 'null') || defaultProducts;

function handleLogin() {
  const id = document.getElementById('login-id').value;
  const pass = document.getElementById('login-pass').value;
  if(id === 'admin' && pass === 'flower2026') {
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('admin-view').style.display = 'block';
    renderAdminProducts();
  } else {
    document.getElementById('login-error').textContent = 'IDまたはパスワードが正しくありません。';
  }
}

function handleLogout() {
  document.getElementById('admin-view').style.display = 'none';
  document.getElementById('login-view').style.display = 'block';
  document.getElementById('login-pass').value = '';
}

function renderAdminProducts() {
  const tbody = document.getElementById('admin-product-list');
  tbody.innerHTML = '';
  
  if(products.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#999; padding:20px;">登録されている商品はありません</td></tr>`;
    return;
  }

  products.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><img src="${p.image || ''}" onerror="this.src='https://via.placeholder.com/40'">${p.name}</td>
      <td>${p.category}</td>
      <td>¥${Number(p.price).toLocaleString()}</td>
      <td>${p.stock}</td>
      <td>
        <button class="btn-sm" onclick="openProductModal(${p.id})">編集</button>
        <button class="btn-sm btn-del" onclick="deleteProduct(${p.id})">削除</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function openProductModal(id = null) {
  document.getElementById('product-modal').classList.add('open');
  if(id) {
    document.getElementById('modal-title').textContent = '商品を編集';
    const p = products.find(x => x.id === id);
    document.getElementById('edit-id').value = p.id;
    document.getElementById('p-name').value = p.name;
    document.getElementById('p-price').value = p.price;
    document.getElementById('p-category').value = p.category;
    document.getElementById('p-stock').value = p.stock;
    document.getElementById('p-color').value = p.color || '';
    document.getElementById('p-image').value = p.image || '';
    document.getElementById('p-desc').value = p.desc || '';
    document.getElementById('p-shipping').value = p.shipping || '常温';
  } else {
    document.getElementById('modal-title').textContent = '新規商品を追加';
    document.getElementById('edit-id').value = '';
    document.getElementById('p-name').value = '';
    document.getElementById('p-price').value = '';
    document.getElementById('p-category').value = 'cut';
    document.getElementById('p-stock').value = '20';
    document.getElementById('p-color').value = 'おまかせ';
    document.getElementById('p-image').value = '';
    document.getElementById('p-desc').value = '';
    document.getElementById('p-shipping').value = '常温';
  }
}

function closeProductModal() {
  document.getElementById('product-modal').classList.remove('open');
}

function saveProductData() {
  const id = document.getElementById('edit-id').value;
  const name = document.getElementById('p-name').value.trim();
  const price = Number(document.getElementById('p-price').value);
  const category = document.getElementById('p-category').value.trim();
  
  if(!name || !price || !category) {
    alert('「商品名」「価格」「カテゴリ」は必須です。');
    return;
  }

  const newData = {
    id: id ? Number(id) : Date.now(),
    name: name,
    price: price,
    category: category,
    stock: Number(document.getElementById('p-stock').value),
    color: document.getElementById('p-color').value,
    image: document.getElementById('p-image').value,
    desc: document.getElementById('p-desc').value,
    shipping: document.getElementById('p-shipping').value
  };

  if(id) {
    const idx = products.findIndex(x => x.id === Number(id));
    if(idx !== -1) products[idx] = newData;
  } else {
    products.unshift(newData);
  }

  localStorage.setItem('hananet_products', JSON.stringify(products));
  closeProductModal();
  renderAdminProducts();
  alert('商品を保存しました！');
}

function deleteProduct(id) {
  if(confirm('本当にこの商品を削除しますか？')) {
    products = products.filter(x => x.id !== id);
    localStorage.setItem('hananet_products', JSON.stringify(products));
    renderAdminProducts();
  }
}
</script>
</body>
</html>
