<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商品管理ダッシュボード - 花ネット</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { background: #fbf7f2; padding: 20px; font-family: "Noto Sans JP", sans-serif; }
  .admin-wrapper { max-width: 1000px; margin: 0 auto; background: #fff; border: 1px solid #eadbd7; border-radius: 8px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
  .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #5b793f; padding-bottom: 15px; margin-bottom: 25px; }
  .admin-header h1 { font-size: 20px; color: #5b793f; margin: 0; }
  .back-link { color: #b65b78; text-decoration: none; font-size: 12px; font-weight: bold; }
  .back-link:hover { text-decoration: underline; }
  
  /* ログイン画面 */
  .login-box { max-width: 400px; margin: 50px auto; padding: 30px; border: 1px solid #eadbd7; border-radius: 8px; background: #fffaf8; text-align: center; }
  .field { margin-bottom: 15px; text-align: left; }
  .field label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #4b433e; }
  .field input, .field textarea, .field select { width: 100%; padding: 8px; border: 1px solid #e0d4cd; border-radius: 4px; box-sizing: border-box; }
  .btn-main { background: #789c55; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
  .btn-main:hover { background: #4d7435; }
  .error-msg { color: #b04e5b; font-size: 12px; margin-top: 10px; }

  /* 管理画面本体 */
  .product-admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 12px; }
  .product-admin-table th, .product-admin-table td { border: 1px solid #e3e8d9; padding: 8px 10px; text-align: left; vertical-align: middle; }
  .product-admin-table th { background: #f3f7eb; color: #4d7435; font-weight: bold; }
  .product-admin-table td img { width: 45px; height: 45px; object-fit: cover; border-radius: 4px; vertical-align: middle; margin-right: 8px; background: #f8f3ee; flex-shrink: 0; }
  
  .btn-sm { padding: 4px 10px; font-size: 11px; border: 1px solid #d96b91; background: #fff0f4; color: #b84c73; border-radius: 3px; cursor: pointer; margin-right: 4px; }
  .btn-sm:hover { background: #d96b91; color: white; }
  .btn-del { border-color: #ccc; background: #f5f5f5; color: #666; }
  .btn-del:hover { background: #d9534f; color: white; border-color: #d9534f; }
  
  .top-action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .btn-add { background: #d96b91; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; }
  .btn-add:hover { background: #b84c73; }

  /* モーダルフォーム */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal-content { background: white; width: min(600px, 100%); max-height: 90vh; overflow-y: auto; padding: 25px; border-radius: 8px; box-shadow: 0 5px 25px rgba(0,0,0,0.2); }
</style>
</head>
<body>

<div id="app">
  <!-- ログイン画面 -->
  <div id="login-view" class="login-box">
    <h2>管理者ログイン</h2>
    <div class="field">
      <label>管理者ID</label>
      <input type="text" id="login-id" value="admin" autocomplete="off">
    </div>
    <div class="field">
      <label>パスワード</label>
      <input type="password" id="login-pass" placeholder="パスワードを入力">
    </div>
    <button class="btn-main" onclick="handleLogin()">ログイン</button>
    <div id="login-error" class="error-msg"></div>
    <div style="margin-top: 20px;">
      <a href="index.html" class="back-link">← サイトトップへ戻る</a>
    </div>
  </div>

  <!-- 管理ダッシュボード画面 -->
  <div id="admin-view" class="admin-wrapper" style="display: none;">
    <div class="admin-header">
      <h1>花ネット — 商品管理ダッシュボード</h1>
      <div>
        <a href="index.html" class="back-link" style="margin-right: 15px;">🌐 サイトを確認</a>
        <a href="#" class="back-link" onclick="handleLogout()">ログアウト</a>
      </div>
    </div>

    <div class="top-action-bar">
      <span>登録されている商品の一覧・編集・削除が行えます。</span>
      <button class="btn-add" onclick="openProductModal()">＋ 新規商品を追加</button>
    </div>

    <table class="product-admin-table">
      <thead>
        <tr>
          <th>商品画像 / 名称</th>
          <th>カテゴリ</th>
          <th>価格（税抜）</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="admin-product-list"></tbody>
    </table>
  </div>
</div>

<!-- 編集・追加用モーダル -->
<div id="product-modal" class="modal-overlay">
  <div class="modal-content">
    <h3 id="modal-title" style="margin-top:0; color:#5b793f;">商品編集</h3>
    <input type="hidden" id="edit-id">
    <div class="field">
      <label>商品名</label>
      <input type="text" id="p-name">
    </div>
    <div class="field">
      <label>価格（税抜・円）</label>
      <input type="number" id="p-price">
    </div>
    <div class="field">
      <label>カテゴリ（分類）</label>
      <input type="text" id="p-category" placeholder="例: cut">
    </div>
    <div class="field">
      <label>商品画像（ファイル添付）</label>
      <input type="file" id="product-image-file" accept="image/*">
      <div id="image-preview-container" style="margin-top:5px;"></div>
    </div>
    <div class="field">
      <label>商品説明</label>
      <textarea id="p-desc" rows="3"></textarea>
    </div>

    <div style="display: flex; gap: 10px; margin-top: 20px;">
      <button class="btn-main" onclick="saveProductData()">保存する</button>
      <button class="btn-main btn-del" onclick="closeProductModal()" style="background:#ddd; color:#333;">キャンセル</button>
    </div>
  </div>
</div>

<script>
let products = [];
let currentImageBase64 = "";

async function fetchAdminProducts() {
  try {
    const res = await fetch('/api/products');
    if (res.ok) {
      products = await res.json();
      renderAdminProducts();
    }
  } catch (err) {
    console.error("データ取得エラー", err);
  }
}

document.addEventListener("DOMContentLoaded", () => {
  if (sessionStorage.getItem('hananet_admin_logged_in') === 'true') {
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('admin-view').style.display = 'block';
    fetchAdminProducts();
  }
});

const fileInput = document.getElementById('product-image-file');
if (fileInput) {
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        currentImageBase64 = e.target.result;
        document.getElementById('image-preview-container').innerHTML = `<img src="${currentImageBase64}" style="width:50px; height:50px; object-fit:cover;">`;
      };
      reader.readAsDataURL(file);
    }
  });
}

function handleLogin() {
  const id = document.getElementById('login-id').value;
  const pass = document.getElementById('login-pass').value;
  if(id === 'admin' && pass === 'flower2026') {
    sessionStorage.setItem('hananet_admin_logged_in', 'true');
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('admin-view').style.display = 'block';
    fetchAdminProducts();
  } else {
    document.getElementById('login-error').textContent = 'IDまたはパスワードが正しくありません。';
  }
}

function handleLogout() {
  sessionStorage.removeItem('hananet_admin_logged_in');
  document.getElementById('admin-view').style.display = 'none';
  document.getElementById('login-view').style.display = 'block';
}

function renderAdminProducts() {
  const tbody = document.getElementById('admin-product-list');
  if (!tbody) return;
  tbody.innerHTML = '';
  
  if(!products || products.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#999; padding:20px;">登録されている商品はありません</td></tr>`;
    return;
  }

  products.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><img src="${p.image || ''}" onerror="this.src='https://via.placeholder.com/45'">${p.name}</td>
      <td>${p.category}</td>
      <td>¥${Number(p.price).toLocaleString()}</td>
      <td>
        <button class="btn-sm" onclick="openProductModal(${p.id})">編集</button>
        <button class="btn-sm btn-del" onclick="deleteProduct(${p.id})">削除</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function openProductModal(id = null) {
  document.getElementById('product-modal').classList.add('open');
  currentImageBase64 = "";
  document.getElementById('product-image-file').value = "";
  document.getElementById('image-preview-container').innerHTML = "";

  if(id !== null) {
    document.getElementById('modal-title').textContent = '商品を編集';
    const p = products.find(x => x.id === id);
    if (p) {
      document.getElementById('edit-id').value = p.id;
      document.getElementById('p-name').value = p.name;
      document.getElementById('p-price').value = p.price;
      document.getElementById('p-category').value = p.category;
      document.getElementById('p-desc').value = p.description || '';
      currentImageBase64 = p.image || "";
      if (currentImageBase64) {
        document.getElementById('image-preview-container').innerHTML = `<img src="${currentImageBase64}" style="width:50px; height:50px; object-fit:cover;">`;
      }
    }
  } else {
    document.getElementById('modal-title').textContent = '新規商品を追加';
    document.getElementById('edit-id').value = '';
    document.getElementById('p-name').value = '';
    document.getElementById('p-price').value = '';
    document.getElementById('p-category').value = 'cut';
    document.getElementById('p-desc').value = '';
  }
}

function closeProductModal() {
  document.getElementById('product-modal').classList.remove('open');
}

async function saveProductData() {
  const id = document.getElementById('edit-id').value;
  const name = document.getElementById('p-name').value.trim();
  const price = Number(document.getElementById('p-price').value);
  const category = document.getElementById('p-category').value.trim();
  const description = document.getElementById('p-desc').value;
  
  if(!name || !price || !category) {
    alert('「商品名」「価格」「カテゴリ」は必須です。');
    return;
  }

  let existingImage = "";
  if(id) {
    const existing = products.find(x => x.id === Number(id));
    if(existing) existingImage = existing.image;
  }
  const finalImage = currentImageBase64 || existingImage;

  const productPayload = {
    id: id ? Number(id) : null,
    name,
    price,
    category,
    image: finalImage,
    description
  };

  try {
    const res = await fetch('/api/products', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(productPayload)
    });

    if (res.ok) {
      alert('商品を保存しました！');
      closeProductModal();
      fetchAdminProducts();
    } else {
      alert('保存に失敗しました。');
    }
  } catch (err) {
    console.error(err);
    alert('通信エラーが発生しました。');
  }
}

async function deleteProduct(id) {
  if(confirm('本当にこの商品を削除しますか？')) {
    try {
      const res = await fetch('/api/products', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: Number(id) })
      });

      if (res.ok) {
        alert('商品を削除しました。');
        fetchAdminProducts();
      } else {
        alert('削除に失敗しました。');
      }
    } catch (err) {
      console.error(err);
      alert('通信エラーが発生しました。');
    }
  }
}
</script>
</body>
</html>
